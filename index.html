<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b4cf0" />
    <title>Magazoo! — Editorial Studio</title>
  </head>
  <body>
    <style>
      .app-loading{font:650 15px/1.5 system-ui,sans-serif;padding:28px;margin:12vh auto;max-width:420px;color:#27324a;text-align:center}
      .startup-art{position:relative;display:block;width:112px;aspect-ratio:640/598;margin:0 auto 16px;filter:drop-shadow(0 10px 18px #3b348126);isolation:isolate}
      .startup-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
      .app-loading-logo{animation:logo-breathe 2s ease-in-out infinite}
      .startup-animal{position:absolute;inset:0;pointer-events:none}.startup-animal img{will-change:transform}
      .startup-animal.monkey{clip-path:polygon(0 0,31% 0,31% 28%,0 30%)}.startup-animal.monkey img{transform-origin:16% 15%;animation:startup-wave 1.8s ease-in-out infinite}
      .startup-animal.cat{clip-path:polygon(29% 0,57% 0,57% 29%,29% 29%)}.startup-animal.cat img{transform-origin:43% 15%;animation:startup-hop 2.15s ease-in-out -.45s infinite}
      .startup-animal.panda{clip-path:polygon(55% 0,81% 2%,81% 39%,55% 37%)}.startup-animal.panda img{transform-origin:68% 20%;animation:startup-wave 2.35s ease-in-out -.8s infinite}
      .startup-animal.squirrel{clip-path:polygon(0 50%,26% 50%,25% 89%,0 91%)}.startup-animal.squirrel img{transform-origin:12% 70%;animation:startup-wave 2.25s ease-in-out -.9s infinite reverse}
      .loading-track{height:4px;background:#e0e7ff;overflow:hidden;margin:14px auto 0;border-radius:99px;max-width:260px}
      .loading-track span{display:block;width:38%;height:100%;border-radius:99px;background:linear-gradient(90deg,#5748e8,#00cfc0);animation:loading-slide 1.2s ease-in-out infinite}
      @keyframes loading-slide{from{transform:translateX(-100%)}to{transform:translateX(390%)}}
      @keyframes logo-breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.015)}}
      @keyframes startup-wave{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-1.8deg) translateY(-2px)}}
      @keyframes startup-hop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.012)}}
      @media(prefers-reduced-motion:reduce){.loading-track span{animation:none;width:100%;opacity:.65}.startup-art *{animation:none!important}}
    </style>
    <div id="root"><div class="app-loading" role="status"><span class="startup-art" aria-hidden="true"><img class="app-loading-logo" src="/magazoo-mark.png" alt="" /><span class="startup-animal monkey"><img src="/magazoo-mark.png" alt="" /></span><span class="startup-animal cat"><img src="/magazoo-mark.png" alt="" /></span><span class="startup-animal panda"><img src="/magazoo-mark.png" alt="" /></span><span class="startup-animal squirrel"><img src="/magazoo-mark.png" alt="" /></span></span>Loading Magazoo…<div class="loading-track"><span></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
