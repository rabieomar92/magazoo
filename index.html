<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>Magazoo! — Editorial Studio</title>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none"><defs><filter id="magazoo-ink" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="discrete" tableValues="0 1"/><feFuncG type="discrete" tableValues="0 1"/><feFuncB type="discrete" tableValues="0 1"/><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer></filter></defs></svg>
    <style>
      .app-loading{font:650 15px/1.5 system-ui,sans-serif;padding:28px;margin:12vh auto;max-width:420px;color:#27324a;text-align:center}
      .startup-art{position:relative;display:block;width:112px;aspect-ratio:640/598;margin:0 auto 16px;filter:url(#magazoo-ink);isolation:isolate}
      .startup-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
      @media(prefers-reduced-motion:reduce){.startup-art *{animation:none!important}}
    </style>
    <div id="root"><div class="app-loading" role="status"><span class="startup-art" aria-hidden="true"><img class="app-loading-logo" src="/magazoo-mark.png" alt="" /></span>Loading Magazoo…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
